apis:
  - aid: hanr-block:hanr-block-api
    name: H&R Block API
    tags:
      - Tax Preparation
      - Financial-Services
    tags_raw:
      - Tax Preparation
      - Financial Services
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://api.hrblock.com
    humanURL: https://www.hrblock.com/partners/tax-import-partners/
    description: >-
      The partner-facing H&R Block integration surface — tax-data import from financial
      institutions, payroll providers and employer solutions. No public contract, reference
      or portal is reachable: api.hrblock.com does not resolve and developer.hrblock.com /
      apiportal.hrblock.com refuse connections from the public internet. Access is by
      bilateral partner agreement through the tax-import partner program.
  - aid: hanr-block:hanr-block-identity
    name: H&R Block Identity (OAuth 2.0 / OpenID Connect)
    tags:
      - Identity
      - Authentication
      - OpenID Connect
    tags_raw:
      - Identity
      - OAuth
      - OpenID Connect
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://login.hrblock.com
    humanURL: https://account.hrblock.com
    properties:
      - url: well-known/hanr-block-openid-configuration.json
        type: OpenIDConnect
      - url: well-known/hanr-block-oauth-authorization-server.json
        type: WellKnown
      - url: authentication/hanr-block-authentication.yml
        type: Authentication
      - url: scopes/hanr-block-scopes.yml
        type: OAuthScopes
      - url: conformance/hanr-block-conformance.yml
        type: Conformance
    description: >-
      H&R Block's customer identity platform, a PingFederate authorization server at
      https://login.hrblock.com serving OpenID Connect discovery and RFC 8414 OAuth 2.0
      authorization-server metadata anonymously (both HTTP 200). It advertises PKCE S256,
      Pushed Authorization Requests, DPoP, mutual-TLS client authentication, dynamic client
      registration, token introspection and revocation, the device grant, token exchange and
      CIBA, plus the proprietary hrbGuaid and hrbUcid scopes. This is the only machine-readable
      contract H&R Block publishes on the open internet.
