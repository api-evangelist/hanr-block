description: >-
  H&R Block (NYSE: HRB) is a US tax-preparation company and Fortune 1000 constituent,
  operating retail tax offices, consumer and small-business tax software, and the MyBlock
  digital platform. It runs no public developer program: the hosts that make up its API
  estate — api.hrblock.com, developer.hrblock.com, the apiportal.hrblock.com Apigee portal,
  apigw, mcp, edge, services and connect — either do not resolve or refuse connections from
  the public internet, and integration is arranged bilaterally through the tax-import
  partner program. The one machine-readable contract H&R Block does serve publicly is the
  OAuth 2.0 / OpenID Connect discovery metadata for its customer identity platform at
  login.hrblock.com.
